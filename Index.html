<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Friday Night Funkin Ultimate</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: white;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu {
      text-align: center;
    }

    .logo {
      width: 420px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .btn {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 22px;
      background: #ff2fa4;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      transition: 0.2s;
    }

    .btn:hover {
      background: #ff5fc2;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="menu">
    <!-- LOGO -->
    <img 
      src="/assets/ui/logo.png" 
      class="logo" 
      alt="Friday Night Funkin Ultimate"
    >

    <!-- BOTÃO -->
    <br>
    <button class="btn" onclick="startGame()">
      PLAY
    </button>
  </div>

  <script>
    function startGame() {
      alert("Gameplay vai começar aqui 🎵");
      // depois você troca isso por:
      // window.location.href = "game.html";
    }
  </script>

</body>
</html>
